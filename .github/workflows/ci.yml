name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # prisma validate resuelve env() del schema; no conecta a la DB. Placeholders
      # bastan — sin esto CI falla en P1012 (DIRECT_URL) antes de lint/typecheck.
      - run: bunx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - run: bun run lint

      - run: bun run typecheck

  # Corre en paralelo a `check` a propósito: si lint/typecheck fallan, el harness
  # e2e sigue dando señal. Antes `needs: check` lo bloqueaba por completo.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # eve (withEve / next.dev) exige Node.js >= 24. El runner de Ubuntu trae 22
      # por defecto y el proceso eve:dev tumba el webServer de Playwright.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bunx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # Sin caché hay que instalar igualmente las libs del sistema.
      - run: bunx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # Corre contra `CRM_UI_PREVIEW`, sin base de datos: ver la nota de
      # cabecera de `playwright.config.ts`. Eso cubre 16 de 28 rutas del CRM;
      # el Tier B (sesión real) solo se activa si existe un DATABASE_URL
      # apuntando a una rama Neon de scratch.
      - run: bun run e2e
        env:
          CRM_UI_PREVIEW: "true"
          AUTH_SECRET: ci-only-secret-at-least-32-characters-long

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
